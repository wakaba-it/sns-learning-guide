            return JSON.parse(saved);

            console.error("Failed to parse saved state", e);
          }
        }
        return {
          lastVisitedChapter: 1,
          chapters: CHAPTERS_DATA.reduce((acc, ch) => {
            acc[ch.id] = {
              isRead: false,
              templateStatus: 'not_started', // 'not_started' | 'in_progress' | 'completed'
              templateAnswer: '',
              templateUpdatedAt: null,
              
              questionsStatus: 'not_started',
              workbookAnswers: {}, // key: q_id, val: answer
              questionsUpdatedAt: null,

              thoughtStatus: 'not_started',
              myThought: '',
              thoughtUpdatedAt: null,

              checkListState: new Array(ch.checkList.length).fill(false),
              todayTask: ''
            };
            return acc;

            day: item.day,
            status: 'not_started', // 'not_started' | 'in_progress' | 'completed'

      // データの自動保存
      React.useEffect(() => {
        try {
          localStorage.setItem('sns_learning_guide_data', JSON.stringify(appData));

      // 章の選択処理

      // 各章の「テンプレート回答」保存
      const saveTemplateAnswer = (chId, text) => {
        const now = new Date().toLocaleString('ja-JP');
        setAppData(prev => ({
          ...prev,
          chapters: {
            ...prev.chapters,

              ...prev.chapters[chId],

              templateUpdatedAt: now
            }
          }
        }));
        showModal("テンプレート直下の回答・文章を保存しました。");
      };

      // 各章の「まとめ質問回答」保存
      const saveWorkbookAnswers = (chId, answersObj) => {
        const now = new Date().toLocaleString('ja-JP');
        setAppData(prev => ({
          ...prev,
          chapters: {

              ...prev.chapters[chId],
              workbookAnswers: answersObj,
              questionsUpdatedAt: now

      // 各章の「自分の考え」保存

          ...prev,
          chapters: {

            [chId]: {

                onSaveWorkbook={saveWorkbookAnswers}

            )}

          {}

        </div>
      );

    function ChapterView({ chapter, state, onSaveTemplate, onSaveWorkbook, onSaveThought, onUpdateStatus, onToggleIsRead, onToggleCheck, onUpdateTodayTask, onCopy, onShowModal }) {
      // ローカルフォーム入力保持用
      const [templateInput, setTemplateInput] = React.useState(state.templateAnswer || '');
      const [wbAnswersInput, setWbAnswersInput] = React.useState(state.workbookAnswers || {});
      const [thoughtInput, setThoughtInput] = React.useState(state.myThought || '');
      const [taskInput, setTaskInput] = React.useState(state.todayTask || '');
      const [isContentOpen, setIsContentOpen] = React.useState(true);

      React.useEffect(() => {
        setTemplateInput(state.templateAnswer || '');
        setWbAnswersInput(state.workbookAnswers || {});
        setThoughtInput(state.myThought || '');
        setTaskInput(state.todayTask || '');
      }, [chapter.id, state]);

      // テンプレートを記入欄に追加（空欄なら原文、あれば末尾追加）
      const handleAddTemplateToTextarea = () => {
        if (!templateInput.trim()) {
          setTemplateInput(chapter.template.text);
        } else {
          setTemplateInput(prev => prev + "\n\n" + chapter.template.text);
        }
      };

      // ワークブック質問回答ハンドラ
      const handleWbChange = (qId, val) => {
        setWbAnswersInput(prev => ({

    function ReviewView({ appData, setAppData, onCopy, onShowModal }) {
      // 振り返りテンプレートデータ
      const [weeklyInput, setWeeklyInput] = React.useState({
        bestPost: '',
        bestReason: '',
        worstPost: '',
        improvePoint: '',
        nextTry: ''
      });

      const [metrics, setMetrics] = React.useState({
        views: '',
        likes: '',
        saves: '',
        profileViews: '',
        actions: ''
      });

      const handleAddWeeklyReview = () => {
        if (!weeklyInput.bestPost && !weeklyInput.nextTry) {
          onShowModal("振り返りの内容を入力してください。");
          return;
        }
        const newEntry = {
          id: Date.now(),
          date: new Date().toLocaleDateString('ja-JP'),
          ...weeklyInput,
          metrics: { ...metrics }
        };
        setAppData(prev => ({
          ...prev,
          weeklyReviews: [newEntry, ...prev.weeklyReviews]
        }));
        setWeeklyInput({ bestPost: '', bestReason: '', worstPost: '', improvePoint: '', nextTry: '' });
        setMetrics({ views: '', likes: '', saves: '', profileViews: '', actions: '' });
        onShowModal("週次振り返り記録を追加しました！");
      };

      return (
        <div className="p-6 md:p-8 space-y-8 max-w-5xl">
          <div>
            <h2 className="text-2xl font-bold text-slate-900">振り返り・最終確認</h2>
            <p className="text-sm text-slate-500 mt-1">ガイド掲載の週次分析・改善テーマ・最終チェックリスト。過去ログを保持して記録を追加できます。</p>
          </div>

          {/* 新しい週次振り返りの追加 */}
          <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6">
            <h3 className="font-bold text-slate-800 text-base border-b border-slate-100 pb-3">週次分析テンプレート記録の追加</h3>
            
            {/* 数値手入力 */}
            <div>
              <span className="text-xs font-bold text-slate-700 block mb-2">今週のSNS数値（手入力）</span>
              <div className="grid grid-cols-2 md:grid-cols-5 gap-3 text-xs">
                <div>
                  <label className="text-slate-500 block mb-1">表示・閲覧</label>
                  <input type="number" placeholder="0" value={metrics.views} onChange={e => setMetrics({...metrics, views: e.target.value})} className="w-full border p-2 rounded" />
                </div>
                <div>
                  <label className="text-slate-500 block mb-1">いいね・反応</label>
                  <input type="number" placeholder="0" value={metrics.likes} onChange={e => setMetrics({...metrics, likes: e.target.value})} className="w-full border p-2 rounded" />
                </div>
                <div>
                  <label className="text-slate-500 block mb-1">保存数</label>
                  <input type="number" placeholder="0" value={metrics.saves} onChange={e => setMetrics({...metrics, saves: e.target.value})} className="w-full border p-2 rounded" />
                </div>
                <div>
                  <label className="text-slate-500 block mb-1">プロフ閲覧</label>
                  <input type="number" placeholder="0" value={metrics.profileViews} onChange={e => setMetrics({...metrics, profileViews: e.target.value})} className="w-full border p-2 rounded" />
                </div>
                <div>
                  <label className="text-slate-500 block mb-1">行動(問合せ等)</label>
                  <input type="number" placeholder="0" value={metrics.actions} onChange={e => setMetrics({...metrics, actions: e.target.value})} className="w-full border p-2 rounded" />
                </div>
              </div>
            </div>

            <div className="space-y-3 text-xs">
              <div>
                <label className="font-bold text-slate-700 block mb-1">今週最も反応が良かった投稿</label>
                <input type="text" value={weeklyInput.bestPost} onChange={e => setWeeklyInput({...weeklyInput, bestPost: e.target.value})} className="w-full border p-2.5 rounded-lg" />
              </div>
              <div>
                <label className="font-bold text-slate-700 block mb-1">理由として考えられること</label>
                <input type="text" value={weeklyInput.bestReason} onChange={e => setWeeklyInput({...weeklyInput, bestReason: e.target.value})} className="w-full border p-2.5 rounded-lg" />
              </div>
              <div>
                <label className="font-bold text-slate-700 block mb-1">最も反応が低かった投稿 & 改善できる点</label>
                <input type="text" value={weeklyInput.worstPost} onChange={e => setWeeklyInput({...weeklyInput, worstPost: e.target.value})} className="w-full border p-2.5 rounded-lg" />
              </div>
              <div>
                <label className="font-bold text-indigo-700 block mb-1">来週試すこと（1つだけ）</label>
                <input type="text" value={weeklyInput.nextTry} onChange={e => setWeeklyInput({...weeklyInput, nextTry: e.target.value})} className="w-full border p-2.5 rounded-lg border-indigo-200 bg-indigo-50/50" />
              </div>
            </div>

            <button 
              onClick={handleAddWeeklyReview}
              className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-5 py-2.5 rounded-lg font-semibold transition"
            >
              週次振り返りを記録として追加
            </button>
          </div>

          {/* 過去の振り返り履歴 */}
          <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
            <h3 className="font-bold text-slate-800 text-base border-b border-slate-100 pb-3">過去の週次振り返り履歴</h3>
            {appData.weeklyReviews.length === 0 ? (
              <p className="text-xs text-slate-400 italic">まだ過去の振り返り記録はありません。</p>
            ) : (
              <div className="space-y-4">
                {appData.weeklyReviews.map(rev => (
                  <div key={rev.id} className="p-4 bg-slate-50 border border-slate-200 rounded-lg text-xs space-y-2">
                    <div className="flex justify-between font-bold text-slate-700">
                      <span>記録日: {rev.date}</span>
                      <span>閲覧: {rev.metrics.views || 0} / 保存: {rev.metrics.saves || 0} / 行動: {rev.metrics.actions || 0}</span>
                    </div>
                    <p><strong>良かった投稿:</strong> {rev.bestPost} ({rev.bestReason})</p>
                    <p><strong>低かった投稿:</strong> {rev.worstPost}</p>
                    <p className="text-indigo-700 font-bold"><strong>来週試すこと:</strong> {rev.nextTry}</p>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }


    function SettingsView({ appData, setAppData, onShowModal, setConfirmModal }) {
      // JSONエクスポート
      const handleExportJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `sns_learning_guide_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        onShowModal("全記録のJSONファイルを書き出しました。");
      };

      // JSONインポート
      const handleImportJSON = (e) => {
        const fileReader = new FileReader();
        if (e.target.files && e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (parsed && parsed.chapters && parsed.roadmap) {
                setConfirmModal({
                  title: "記録の読み込み確認",
                  message: "既存の学習記録が読み込んだファイルの内容で置き換わります。よろしいですか？",
                  onConfirm: () => {
                    setAppData(parsed);
                    onShowModal("記録の読み込みが完了しました。");
                  }
                });
              } else {
                onShowModal("不正なフォーマットのJSONファイルです。検証に失敗しました。");
              }
            } catch (err) {
              onShowModal("JSONファイルの解析に失敗しました。");
            }
          };
        }
      };

      // リセット
      const handleResetData = () => {
        setConfirmModal({
          title: "全記録の初期化",
          message: "すべての回答、完成文章、チェック状態が消去されます。この操作は取り消せません。本当に初期化しますか？",
          onConfirm: () => {
            localStorage.removeItem('sns_learning_guide_data');
            window.location.reload();
          }
        });
      };

      return (
        <div className="p-6 md:p-8 space-y-8 max-w-4xl">
          <div>
            <h2 className="text-2xl font-bold text-slate-900">保存設定</h2>
            <p className="text-sm text-slate-500 mt-1">データのバックアップ、復元、およびストレージ管理を行えます。</p>
          </div>

          <div className="bg-amber-50 border border-amber-200 text-amber-900 p-4 rounded-xl text-xs space-y-1">
            <span className="font-bold block text-sm">⚠️ 保存に関するご注意</span>
            <p>入力したすべての内容と進捗は、お使いのブラウザ内（ローカルストレージ）に自動保存されます。</p>
            <p>端末間・ブラウザ間での自動同期機能はありません。別の端末にデータを移す場合は、「JSON書き出し」をご利用ください。</p>
          </div>

          <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6">
            <h3 className="font-bold text-slate-800 text-base border-b border-slate-100 pb-3">データのバックアップと復元</h3>

            <div className="space-y-4">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 bg-slate-50 rounded-lg border border-slate-200/70 gap-3">
                <div>
                  <h4 className="font-bold text-xs text-slate-800">全記録のJSON書き出し</h4>
                  <p className="text-[11px] text-slate-500 mt-0.5">全14章の全回答・完成文章・ロードマップ・振り返り履歴をファイル保存します。</p>
                </div>
                <button 
                  onClick={handleExportJSON}
                  className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-4 py-2 rounded-lg font-semibold transition shrink-0"
                >
                  JSON書き出し
                </button>
              </div>

              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 bg-slate-50 rounded-lg border border-slate-200/70 gap-3">
                <div>
                  <h4 className="font-bold text-xs text-slate-800">JSONファイルから復元</h4>
                  <p className="text-[11px] text-slate-500 mt-0.5">保存したバックアップJSONファイルを読み込んで全記録を安全に再構築します。</p>
                </div>
                <label className="bg-slate-800 hover:bg-slate-900 text-white text-xs px-4 py-2 rounded-lg font-semibold transition cursor-pointer shrink-0">
                  <span>JSON読み込み</span>
                  <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
                </label>
              </div>
            </div>
          </div>

          <div className="bg-white p-6 rounded-xl border border-rose-200 shadow-sm space-y-4">
            <h3 className="font-bold text-rose-800 text-base border-b border-rose-100 pb-3">全記録の初期化</h3>
            <p className="text-xs text-slate-600">端末内に保存されている全データをクリアし、初期状態に戻します。</p>
            <button 
              onClick={handleResetData}
              className="bg-rose-600 hover:bg-rose-700 text-white text-xs px-4 py-2 rounded-lg font-semibold transition"
            >
              すべてのデータを初期化する
            </button>
          </div>
        </div>
      );
    }

    
    window.onload = function() {
      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    };
  </script>
</body>
</html>
